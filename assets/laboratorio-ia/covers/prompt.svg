  <rect x="790" y="430" width="420" height="14" rx="7" fill="#94a3b8" fill-opacity="0.6"/>
  <rect x="790" y="460" width="310" height="14" rx="7" fill="#94a3b8" fill-opacity="0.45"/>
  <rect x="790" y="520" width="250" height="56" rx="18" fill="#f0a0a0" fill-opacity="0.18" stroke="#f0a0a0" stroke-opacity="0.28"/>
  <text x="828" y="556" fill="#ffd7d7" font-size="24" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600">Ficha canónica</text>

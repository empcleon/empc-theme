<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Portada del área de Prompts EMPC</title>
  <desc id="desc">Ilustración geométrica coral con bloques de texto y un símbolo de prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2034"/>
      <stop offset="100%" stop-color="#0f1624"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0a0a0"/>
      <stop offset="100%" stop-color="#e29595"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="210" r="180" fill="#e29595" fill-opacity="0.10"/>
  <circle cx="1260" cy="160" r="230" fill="#f0a0a0" fill-opacity="0.07"/>

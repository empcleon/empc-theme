<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>El jardín del caos</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#07090f;
               font-family:'Segoe UI', system-ui, sans-serif; }
  #lienzo { position:fixed; inset:0; display:block; cursor:crosshair; }
  #panel { position:fixed; top:12px; left:12px; z-index:10; color:#e8eefc;
           background:rgba(13,17,28,.82); border:1px solid #232c45; border-radius:14px;
           padding:14px 16px; max-width:305px; backdrop-filter:blur(6px); }
  #panel h1 { margin:0 0 2px; font-size:19px; letter-spacing:.4px; }
  #panel .sub { margin:0 0 10px; font-size:11.5px; color:#7f8db0; line-height:1.45; }
  select { width:100%; background:#0d1120; color:#e8eefc; border:1px solid #2c3854;
           border-radius:8px; padding:7px 8px; font-size:13.5px; margin-bottom:9px; }
  .fila { display:flex; gap:6px; margin-bottom:9px; }
  button { flex:1; background:#141b30; color:#e8eefc; border:1px solid #2c3854;
           border-radius:8px; padding:7px 4px; font-size:12.5px; cursor:pointer; }
  button:hover { background:#1d2745; border-color:#4f7dd9; }
  label.vel { display:block; font-size:11px; color:#7f8db0; margin-bottom:2px; }
  input[type=range] { width:100%; accent-color:#c9a227; }
  #info { position:fixed; left:12px; right:12px; bottom:10px; z-index:10; color:#9fb0d8;
          background:rgba(13,17,28,.78); border:1px solid #232c45; border-radius:12px;
          padding:8px 14px; font-size:12px; display:flex; justify-content:space-between;
          gap:14px; flex-wrap:wrap; backdrop-filter:blur(6px); }
  #info .eq { font-family:Georgia, serif; font-style:italic; }
  #lab { color:#c9a227; font-variant-numeric:tabular-nums; }
  #aviso { color:#5b657e; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>

<div id="panel">
  <h1>🦋 El jardín del caos</h1>
  <p class="sub">Seis atractores extraños en vivo. <b>Arrastra</b> para moverte, <b>rueda</b> para zoom,
     <b>clic</b> para soltar mariposas allí mismo.</p>
  <select id="sistema"></select>
  <div class="fila">
    <button id="btnSoltar">🦋 Soltar mariposas</button>
    <button id="btnDoble">×2 población</button>
    <button id="btnLimpiar">🧹 Limpiar</button>
  </div>
  <label class="vel">velocidad: <span id="velTxt">4</span> pasos/fotograma</label>
  <input type="range" id="vel" min="1" max="20" value="4">
</div>

<div id="info">
  <span class="eq" id="eq"></span>
  <span id="lab">…</span>
  <span id="aviso">determinista, pero impredecible: dos mariposas nacidas pegadas vivirán vidas opuestas</span>
</div>

<script>
/* ===== núcleo puro (testable) ===== */
function rk4(f, p, dt) {
  const k1 = f(p);
  const k2 = f(p.map((v,i)=>v + dt/2*k1[i]));
  const k3 = f(p.map((v,i)=>v + dt/2*k2[i]));
  const k4 = f(p.map((v,i)=>v + dt*k3[i]));
  return p.map((v,i)=>v + dt/6*(k1[i] + 2*k2[i] + 2*k3[i] + k4[i]));
}
const SISTEMAS = [
  { nombre:"Lorenz (1963)", dt:0.004, semilla:[0.1,0,0], hue0:15,
    eq:"ẋ=σ(y−x),  σ=10, ρ=28, β=8/3 · λ₁≈0.84",
    f: p => [10*(p[1]-p[0]), p[0]*(28-p[2])-p[1], p[0]*p[1]-8/3*p[2]] },
  { nombre:"Rössler (1976)", dt:0.02, semilla:[0.1,0,0], hue0:150,
    eq:"ẋ=−y−z,  a=b=0.2, c=5.7 · λ₁≈0.07",
    f: p => [-p[1]-p[2], p[0]+0.2*p[1], 0.2+p[2]*(p[0]-5.7)] },
  { nombre:"Aizawa", dt:0.01, semilla:[0.1,0,0], hue0:280,
    eq:"a=0.95, b=0.7, c=0.6, d=3.5, e=0.25, f=0.1 · λ₁≈0.08",
    f: p => [(p[2]-0.7)*p[0]-3.5*p[1], 3.5*p[0]+(p[2]-0.7)*p[1],
             0.6+0.95*p[2]-p[2]*p[2]*p[2]/3-(p[0]*p[0]+p[1]*p[1])*(1+0.25*p[2])+0.1*p[2]*p[0]**3] },
  { nombre:"Thomas (b=0.10)", dt:0.05, semilla:[0.1,0,0], hue0:45,
    eq:"ẋ=sen(y)−bx,  b=0.10 · λ₁≈0.05 (¡b=0.19 ya no es caótico!)",
    f: p => [Math.sin(p[1])-0.10*p[0], Math.sin(p[2])-0.10*p[1], Math.sin(p[0])-0.10*p[2]] },
  { nombre:"Halvorsen (a=1.4)", dt:0.005, semilla:[-1.48,-1.51,2.04], hue0:200,
    eq:"ẋ=−ax−4y−4z−y²,  a=1.4 · λ₁≈0.70 (el catálogo dice a=1.89…)",
    f: p => [-1.4*p[0]-4*p[1]-4*p[2]-p[1]*p[1],
             -1.4*p[1]-4*p[2]-4*p[0]-p[2]*p[2],
             -1.4*p[2]-4*p[0]-4*p[1]-p[0]*p[0]] },
  { nombre:"Dadras–Momeni", dt:0.008, semilla:[1.1,2.1,-2.0], hue0:330,
    eq:"a=3, b=2.7, c=1.7, d=2, e=9 · λ₁≈0.42",
    f: p => [p[1]-3*p[0]+2.7*p[1]*p[2], 1.7*p[1]-p[0]*p[2]+p[2], 2*p[0]*p[1]-9*p[2]] }
];
function encuadre(sys) {           // auto-fit: integra y mide la caja
  let p = sys.semilla.slice();
  const pts = [];
  for (let i = 0; i < 9000; i++) { p = rk4(sys.f, p, sys.dt); if (i > 2000) pts.push(p); }
  let x0=1e9, x1=-1e9, z0=1e9, z1=-1e9, ok=true;
  for (const q of pts) {
    if (!q.every(isFinite)) { ok=false; break; }
    x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]); z0=Math.min(z0,q[2]); z1=Math.max(z1,q[2]);
  }
  if (!ok) return { cx:0, cz:0, half:10 };
  return { cx:(x0+x1)/2, cz:(z0+z1)/2, half:Math.max(x1-x0, z1-z0)/2*1.15 + 1e-6 };
}
/* ===== fin núcleo puro ===== */

const cv = document.getElementById("lienzo"), ctx = cv.getContext("2d");
let W, H, DPR;
function redim() {
  DPR = window.devicePixelRatio || 1;
  W = cv.width  = Math.round(innerWidth * DPR);
  H = cv.height = Math.round(innerHeight * DPR);
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  pintaFondo();
}
function pintaFondo() { ctx.fillStyle = "#07090f"; ctx.fillRect(0, 0, W, H); }

let sys, vista, partes, gemelo, labLog, labPasos;
const TRAIL = 240, MAXPART = 3000;

function nuevoSistema(idx) {
  sys = SISTEMAS[idx];
  vista = encuadre(sys);            // {cx, cz, half} -> escala según pantalla
  vista.esc = Math.min(W, H) / (2 * vista.half);
  pintaFondo();
  partes = []; gemelaNube(vista.cx, vista.cz, 140);
  reiniciaGemelo();
  document.getElementById("eq").textContent = sys.nombre + " — " + sys.eq;
}
function gemelaNube(cx, cz, n) {
  const j = vista.half * 0.04;
  for (let i = 0; i < n && partes.length < MAXPART; i++) {
    partes.push({ p: sys.semilla.map((v,k)=> k===0 ? v+(Math.random()-0.5)*j*4 : v+(Math.random()-0.5)*j),
                  hue: (sys.hue0 + i*137.508) % 360, trail: [] });
  }
}
function reiniciaGemelo() { gemelo = null; labLog = 0; labPasos = 0; }

let pasosFrame = 4;
function paso() {
  const f = sys.f, dt = sys.dt;
  for (const b of partes) {
    for (let s = 0; s < pasosFrame; s++) b.p = rk4(f, b.p, dt);
    if (!b.p.every(isFinite)) { b.p = sys.semilla.slice(); b.trail.length = 0; }
    b.trail.push([b.p[0], b.p[2]]);
    if (b.trail.length > TRAIL) b.trail.shift();
  }
  /* laboratorio gemelo: dos órbitas nacidas a 1e-6 una de la otra */
  const base = partes[0].p;
  if (!gemelo) gemelo = base.map((v,i)=> i===0 ? v+1e-6 : v);
  for (let s = 0; s < pasosFrame; s++) gemelo = rk4(f, gemelo, dt);
  const d = Math.hypot(gemelo[0]-base[0], gemelo[1]-base[1], gemelo[2]-base[2]);
  if (isFinite(d) && d > 0) { labLog += Math.log(d/1e-6); labPasos += pasosFrame*dt; }
  if (!isFinite(d) || d > vista.half) gemelo = null;   // saturó: renace otra pareja
}
function dibuja() {
  ctx.fillStyle = "rgba(7,9,15,0.085)";               // estelas que se apagan
  ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 1.25 * DPR; ctx.globalAlpha = 0.8;
  const e = vista.esc, cx = W/2 - vista.cx*e, cy = H/2 + vista.cz*e;
  for (const b of partes) {
    const t = b.trail; if (t.length < 2) continue;
    ctx.strokeStyle = "hsl(" + b.hue + ",92%,62%)";
    ctx.beginPath();
    ctx.moveTo(cx + t[0][0]*e, cy - t[0][1]*e);
    for (let i = 1; i < t.length; i++) ctx.lineTo(cx + t[i][0]*e, cy - t[i][1]*e);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function bucle() { paso(); dibuja(); labUI(); requestAnimationFrame(bucle); }
function labUI() {
  const d = Math.hypot(gemelo?gemelo[0]-partes[0].p[0]:0, gemelo?gemelo[1]-partes[0].p[1]:0, gemelo?gemelo[2]-partes[0].p[2]:0);
  const lam = labPasos > 0 ? (labLog/labPasos) : 0;
  document.getElementById("lab").textContent =
    "laboratorio gemelo · separación " + (d||1e-6).toExponential(2) +
    " · λ₁(en vivo) ≈ " + lam.toFixed(2);
}

/* interacción: arrastrar, zoom, clic que suelta mariposas, pellizco */
let arrastrando = null;
cv.addEventListener("mousedown", e => { arrastrando = { x:e.clientX, y:e.clientY, movio:false }; });
window.addEventListener("mousemove", e => {
  if (!arrastrando) return;
  const dx = e.clientX-arrastrando.x, dy = e.clientY-arrastrando.y;
  if (Math.abs(dx)+Math.abs(dy) > 3) arrastrando.movio = true;
  vista.cx -= dx/vista.esc; vista.cz += dy/vista.esc;
  arrastrando.x = e.clientX; arrastrando.y = e.clientY;
});
window.addEventListener("mouseup", e => {
  if (arrastrando && !arrastrando.movio) {
    const wx = vista.cx + (e.clientX - W/2)/vista.esc;
    const wz = vista.cz - (e.clientY - H/2)/vista.esc;
    gemelaNube(wx, wz, 25); reiniciaGemelo();
  }
  arrastrando = null;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.15 : 1/1.15;
  const wx = vista.cx + (e.clientX - W/2)/vista.esc;
  const wz = vista.cz - (e.clientY - H/2)/vista.esc;
  vista.esc *= k;
  vista.cx = wx - (e.clientX - W/2)/vista.esc;
  vista.cz = wz + (e.clientY - H/2)/vista.esc;
}, { passive:false });
let pinch = null;
cv.addEventListener("touchstart", e => {
  if (e.touches.length === 1) pinch = { x:e.touches[0].clientX, y:e.touches[0].clientY, d:0, movio:false };
  else if (e.touches.length === 2)
    pinch = { d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY),
              x:0, y:0, movio:true };
}, { passive:false });
cv.addEventListener("touchmove", e => {
  e.preventDefault();
  if (e.touches.length === 1 && pinch) {
    if (pinch.d === 0) {
      const dx = e.touches[0].clientX-pinch.x, dy = e.touches[0].clientY-pinch.y;
      if (Math.abs(dx)+Math.abs(dy) > 3) pinch.movio = true;
      vista.cx -= dx/vista.esc; vista.cz += dy/vista.esc;
    }
    pinch.x = e.touches[0].clientX; pinch.y = e.touches[0].clientY;
  } else if (e.touches.length === 2 && pinch) {
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if (pinch.d > 0) vista.esc *= d/pinch.d;
    pinch.d = d;
  }
}, { passive:false });
cv.addEventListener("touchend", e => {
  if (pinch && !pinch.movio && pinch.d === 0) {
    const wx = vista.cx + (pinch.x - W/2)/vista.esc;
    const wz = vista.cz - (pinch.y - H/2)/vista.esc;
    gemelaNube(wx, wz, 25); reiniciaGemelo();
  }
  pinch = null;
});

document.getElementById("btnSoltar").onclick = () => { gemelaNube(vista.cx, vista.cz, 60); reiniciaGemelo(); };
document.getElementById("btnDoble").onclick  = () => gemelaNube(vista.cx, vista.cz, Math.min(partes.length, 600));
document.getElementById("btnLimpiar").onclick = () => { pintaFondo(); nuevoSistema(sel.value|0); };
document.getElementById("vel").oninput = e => {
  pasosFrame = +e.target.value;
  document.getElementById("velTxt").textContent = pasosFrame;
};
const sel = document.getElementById("sistema");
SISTEMAS.forEach((s,i) => { const o = document.createElement("option"); o.value = i; o.textContent = s.nombre; sel.appendChild(o); });
sel.onchange = () => nuevoSistema(+sel.value);

window.addEventListener("resize", redim);
redim();
nuevoSistema(0);
bucle();
</script>
</body>
</html>
